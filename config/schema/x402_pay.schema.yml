x402_pay.settings:
  type: config_object
  label: 'x402 Pay settings'
  mapping:
    agent_user_agents:
      type: string
      label: 'User-Agent pattern for agents (regex, case-insensitive)'
    facilitator:
      type: mapping
      label: 'Facilitator'
      mapping:
        auth:
          type: string
          label: 'keyless or api_key'
        api_key_id:
          type: string
          label: 'Circle API key (Key module id)'
        own_networks:
          type: sequence
          label: 'Networks this site settles itself'
          sequence:
            type: string
        own_key_id:
          type: string
          label: 'Gas wallet key (Key module id)'
    sweep:
      type: mapping
      label: 'Sweep seller wallets'
      mapping:
        enabled:
          type: boolean
          label: 'Sweep on cron'
        to:
          type: string
          label: 'Cold wallet address'
        keys:
          type: sequence
          label: 'Seller keys swept (Key module ids)'
          sequence:
            type: string
        min:
          type: string
          label: 'Smallest sweep, in USDC'
        interval:
          type: integer
          label: 'Seconds between sweeps'

field.storage_settings.x402_price:
  type: mapping
  label: 'x402 price storage settings'

field.field_settings.x402_price:
  type: mapping
  label: 'x402 price settings'
  mapping:
    enabled:
      type: boolean
      label: 'Charge agents'
    amount:
      type: string
      label: 'Price in USD'
    network:
      type: string
      label: 'CAIP-2 network'
    key_id:
      type: string
      label: 'Seller key'
    pay_to:
      type: string
      label: 'Seller address, without a key'
    allow_override:
      type: boolean
      label: 'Each entity can set its own price'
    view_mode:
      type: string
      label: 'View mode sold'
    canonical:
      type: boolean
      label: "Charge agents on the entity's own URL"

field.value.x402_price:
  type: mapping
  label: 'Default value'
  mapping:
    enabled:
      type: boolean
      label: 'Charge for this'
    amount:
      type: string
      label: 'Own price in USD'
