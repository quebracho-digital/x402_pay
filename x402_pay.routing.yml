x402_pay.entity:
  path: '/x402/{entity_type}/{entity}/{view_mode}'
  defaults:
    view_mode: ''
    _controller: '\Drupal\x402_pay\Controller\PaidEntityController'
  options:
    parameters:
      entity:
        type: 'entity:{entity_type}'
  requirements:
    _entity_access: 'entity.view'

x402_pay.discovery:
  path: '/x402/discovery'
  defaults:
    _controller: '\Drupal\x402_pay\Controller\DiscoveryController'
  methods: [GET]
  requirements:
    # Public: the catalogue lists only what the visitor can see and buy.
    _access: 'TRUE'

x402_pay.settings:
  path: '/admin/config/services/x402'
  defaults:
    _form: '\Drupal\x402_pay\Form\SettingsForm'
    _title: 'x402 Pay'
  requirements:
    _permission: 'administer x402 pay'

x402_pay.solana_transaction:
  path: '/x402/solana/transaction'
  defaults:
    _controller: '\Drupal\x402_pay\Controller\SolanaTransactionController'
  methods: [POST]
  requirements:
    # Public: it builds bytes for the visitor's own wallet to sign; flood
    # limited, since each asks the node for a blockhash.
    _access: 'TRUE'
