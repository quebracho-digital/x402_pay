services:
  _defaults:
    autowire: true
  logger.channel.x402_pay:
    parent: logger.channel_base
    arguments: ['x402_pay']
  x402_pay.facilitator:
    class: Drupal\x402_pay\CircleFacilitator
  x402_pay.log:
    class: Drupal\x402_pay\PaymentLog
  x402_pay.gate:
    class: Drupal\x402_pay\PaymentGate
    arguments: ['@x402_pay.facilitator', '@x402_pay.log']
  x402_pay.delivery:
    class: Drupal\x402_pay\Delivery
    arguments: ['@x402_pay.gate', '@entity_type.manager', '@renderer', '@logger.channel.x402_pay']
  x402_pay.agent_request_subscriber:
    class: Drupal\x402_pay\EventSubscriber\AgentRequestSubscriber
    arguments: ['@x402_pay.delivery', '@config.factory', '@page_cache_kill_switch']
    tags:
      - { name: event_subscriber }
