services:
  _defaults:
    autowire: true
  logger.channel.x402_pay:
    parent: logger.channel_base
    arguments: ['x402_pay']
  x402_pay.psr17:
    class: GuzzleHttp\Psr7\HttpFactory
  x402_pay.psr_http_factory:
    class: Symfony\Bridge\PsrHttpMessage\Factory\PsrHttpFactory
    arguments: ['@x402_pay.psr17', '@x402_pay.psr17', '@x402_pay.psr17', '@x402_pay.psr17']
  x402_pay.http_foundation_factory:
    class: Symfony\Bridge\PsrHttpMessage\Factory\HttpFoundationFactory
  x402_pay.facilitators:
    class: Drupal\x402_pay\Facilitators
    arguments: ['@http_client', '@x402_pay.psr17', '@config.factory', '@key.repository', '@lock', '@cache.default']
  # Deprecated in 1.0.0-beta3, removed in 2.0.0: use x402_pay.facilitators.
  x402_pay.facilitator:
    class: Drupal\x402_pay\CircleFacilitator
    autowire: false
    arguments: ['@http_client', 'https://api.circle.com/v1/facilitator/x402', 1, 5, '@config.factory', '@key.repository']
    deprecated: The "%service_id%" service is deprecated in x402_pay:1.0.0-beta3 and is removed from x402_pay:2.0.0. Use x402_pay.facilitators instead. See https://www.drupal.org/project/x402_pay/issues/3634901
  x402_pay.chain_facilitator:
    class: Drupal\x402_pay\ChainFacilitator
    autowire: false
    arguments: ['@http_client', '@config.factory', '@key.repository', '@lock']
    deprecated: The "%service_id%" service is deprecated in x402_pay:1.0.0-beta3 and is removed from x402_pay:2.0.0. Use x402_pay.facilitators instead. See https://www.drupal.org/project/x402_pay/issues/3634901
  x402_pay.remote_facilitator:
    class: Drupal\x402_pay\RemoteFacilitator
    autowire: false
    arguments: ['@http_client', '@config.factory', '@key.repository', '@cache.default']
    deprecated: The "%service_id%" service is deprecated in x402_pay:1.0.0-beta3 and is removed from x402_pay:2.0.0. Use x402_pay.facilitators instead. See https://www.drupal.org/project/x402_pay/issues/3634901
  x402_pay.claims:
    class: Drupal\x402_pay\ClaimStore
    arguments: ['@database', '@datetime.time']
  x402_pay.log:
    class: Drupal\x402_pay\PaymentLog
  x402_pay.gate:
    class: Drupal\x402_pay\PaymentGate
    arguments: ['@x402_pay.facilitators', '@x402_pay.log', '@x402_pay.claims', '@x402_pay.psr17', '@x402_pay.psr_http_factory', '@x402_pay.http_foundation_factory', '@event_dispatcher', '@settings', '@flood', '@config.factory']
  x402_pay.delivery:
    class: Drupal\x402_pay\Delivery
    arguments: ['@x402_pay.gate', '@renderer', '@event_dispatcher', '@current_user', '@logger.channel.x402_pay']
  x402_pay.agent_request_subscriber:
    class: Drupal\x402_pay\EventSubscriber\AgentRequestSubscriber
    arguments: ['@x402_pay.delivery', '@config.factory', '@page_cache_kill_switch']
    tags:
      - { name: event_subscriber }
  x402_pay.markdown_path_processor:
    class: Drupal\x402_pay\PathProcessor\MarkdownPathProcessor
    tags:
      # After the language prefix (300) and private files (200, which turns
      # /system/files/a.md into a query), before aliases (100).
      - { name: path_processor_inbound, priority: 150 }
  x402_pay.page_cache_request_policy:
    class: Drupal\x402_pay\PageCache\AgentRequestPolicy
    tags:
      - { name: page_cache_request_policy }
  x402_pay.sweeper:
    class: Drupal\x402_pay\Sweeper
    arguments:
      $httpClient: '@http_client'
      $psr17: '@x402_pay.psr17'
      $keys: '@key.repository'
      $logger: '@logger.channel.x402_pay'
  Drupal\x402_pay\Sweeper: '@x402_pay.sweeper'
  x402_pay.reconciler:
    class: Drupal\x402_pay\Reconciler
    arguments:
      $httpClient: '@http_client'
      $logger: '@logger.channel.x402_pay'
  Drupal\x402_pay\Reconciler: '@x402_pay.reconciler'
  Drupal\x402_pay\ClaimStore: '@x402_pay.claims'
  GuzzleHttp\Psr7\HttpFactory: '@x402_pay.psr17'
