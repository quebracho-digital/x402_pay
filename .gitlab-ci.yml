include:
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - '/includes/include.drupalci.main.yml'
      - '/includes/include.drupalci.variables.yml'
      - '/includes/include.drupalci.workflows.yml'

variables:
  _TARGET_DRUPAL: 11.0
  _TARGET_PHP: 8.3
  _PHPUNIT_EXTRA: --verbose
  OPT_IN_TEST_PREVIOUS_MAJOR: 1
  OPT_IN_TEST_PREVIOUS_MINOR: 0
  OPT_IN_TEST_NEXT_MINOR: 1
  OPT_IN_TEST_NEXT_MAJOR: 1
  OPT_IN_TEST_MAX_PHP: 1
  _PHPUNIT_CONCURRENT: 1
  SKIP_ESLINT: 1

# The drupal.org images have no gmp, which the secp256k1 and keccak
# libraries need (signatures). Their PHP is built in /usr/local (apt's
# php8.3-gmp is for another build) and ships no source: build the extension
# from the same version's source with phpize. Tried in the image itself.
.with-gmp: &with-gmp
  - apt-get update -qq && apt-get install -y -qq libgmp-dev $PHPIZE_DEPS > /dev/null
  - V=$(php -r 'echo PHP_VERSION;') && curl -fsSL "https://www.php.net/distributions/php-$V.tar.gz" | tar xz -C /tmp "php-$V/ext/gmp"
  - (cd /tmp/php-*/ext/gmp && phpize > /dev/null && ./configure -q > /dev/null && make -s -j4 > /dev/null && make -s install > /dev/null)
  - docker-php-ext-enable gmp && php -m | grep -qx gmp
.phpunit-base:
  before_script: *with-gmp

phpcs:
  allow_failure: false
phpstan:
  allow_failure: false
  before_script:
    - *with-gmp
    - composer require --dev drush/drush

# ponytail: copy of the template's exclude list plus the PHPStan turbo-ext
# files that push the composer artifact over the upload limit (413). Drop
# this block once gitlab_templates!528 (#3572444) is merged.
.composer-base:
  before_script: *with-gmp
  artifacts:
    exclude:
      - '.git'
      - '.git/**/*'
      - '$_WEB_ROOT/**/.git'
      - '$_WEB_ROOT/**/.git/**/*'
      - 'vendor/**/.git'
      - 'vendor/**/.git/**/*'
      - 'vendor/phpstan/phpstan/turbo-ext/**'
